name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build SlothPlayer
        run: |
          cmake --build build --config Release

      - name: Package Release
        run: |
          mkdir dist
          copy build\SlothPlayer.exe dist\
          copy README.md dist\
          copy LICENSE dist\
          powershell Compress-Archive -Path dist\* -DestinationPath SlothPlayer-windows-x64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlothPlayer-windows-x64
          path: SlothPlayer-windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SlothPlayer-windows-x64.zip
          generate_release_notes: true
